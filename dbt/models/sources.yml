version: 2

# RAW (Bronze) tables loaded by snowflake/05_load_raw.sql
sources:
  - name: raw
    schema: raw
    # Freshness = observability: `dbt source freshness` warns if no new file landed.
    loaded_at_field: _loaded_at
    freshness:
      warn_after:  {count: 24, period: hour}
      error_after: {count: 72, period: hour}
    tables:
      - name: security_master
      - name: transactions
      - name: positions
      - name: market_prices
      - name: restricted_securities
